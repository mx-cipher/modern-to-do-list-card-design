<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="todo-card">
        <h1>My To-Do List</h1>

        <div class="task-item">
            <label class="task-label">
                <input type="checkbox"> Explore faming keyboards
            </label>
            <ul class="task-links">
                <li>
                    <a href="#store" target="_blank">Store link</a>
                </li>
            </ul>
        </div>

        <div class="task-item">
            <label class="task-label">
                <input type="checkbox"> Finish the report
            </label>
            <ul class="task-links">
                <li>
                    <a href="#store" target="_blank">Request Access</a>
                </li>
            </ul>
        </div>

        <div class="task-item">
            <label class="task-label">
                <input type="checkbox"> View Phone's Warranty
            </label>
            <ul class="task-links">
                <li>
                    <a href="#store" target="_blank">View Receipts</a>
                </li>
            </ul>
        </div>

        <div class="task-item">
            <label class="task-label">
                <input type="checkbox"> Check Processor Specs
            </label>
            <ul class="task-links">
                <li>
                    <a href="#store" target="_blank">View Model Number</a>
                </li>
            </ul>
        </div>

    </div>

</body>
</html>
